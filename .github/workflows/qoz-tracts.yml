name: qoz-tracts
# The CDFI Fund's list of designated Qualified Opportunity Zone tracts →
# data/qoz-tracts.json (#473): every designated tract by its 2010 number, so
# the site flags answer the Opportunity Zone question in every state rather
# than only where the registry was loaded (scripts/fetch-qoz-tracts.mjs says
# why and what the runner printed of the file).
#
# The list goes to its own branch, `qoz-tracts`, force-pushed each run and
# never merged: the sandbox cannot reach cdfifund.gov, but it can fetch a
# branch of this repository, so the list is read from there and committed
# with the code that reads it. Dispatch only — the 2018 designations do not
# change.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Read the designated tracts
        run: node scripts/fetch-qoz-tracts.mjs
      - name: Publish the list to its own branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp data/qoz-tracts.json out/
          cd out
          git init -q -b qoz-tracts
          git config user.name "qoz-tracts"
          git config user.email "qoz-tracts@users.noreply.github.com"
          git add -A
          git commit -q -m "qoz-tracts $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" qoz-tracts
          echo "Pushed qoz-tracts.json to the qoz-tracts branch."
