          mark "#325 the ground lease is on /tools" grep -q "The lease ends, so the leasehold ends with it" p_tools2.html
          mark "#325 the two halves move opposite ways" grep -q "opposite directions as it runs" p_tools2.html
          mark "#326 the inversion is on /tools" grep -q "What you would have to believe" p_tools2.html
          # The caveat that keeps the card honest: an unlevered solve fed a
