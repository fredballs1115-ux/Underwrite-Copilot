name: live-verify
# Fetches the LIVE site from GitHub's network (the build container cannot
# reach it) and reports exactly what it serves — the decisive evidence for
# "did the deploy land". Run manually (Actions tab → live-verify → Run
# workflow) or automatically on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # First, before any fetch: the page lint at the end runs from the repo
      # (scripts/lint-pages.mjs + lib/render-lint.ts), and a checkout into a
      # workspace that already holds files clears them.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch live homepage
        # Cache-busting query + no-cache request header: the verdict must
        # reflect the ORIGIN's current build, never a stale CDN/SWR copy.
        run: |
          set -x
          curl -sS -D headers.txt -o body.html --max-time 60 \
            -H "Cache-Control: no-cache" \
            "https://underwrite-copilot.onrender.com/?probe=${GITHUB_RUN_ID}" || true
          echo "== RESPONSE HEADERS =="; cat headers.txt || true
          echo "== BYTES =="; wc -c body.html || true
      - name: Check for current-build markers
        run: |
          echo "== MARKER CHECKS =="
          # The Sep 8 simplification (#240) cut the homepage to one idea per
          # section — the markers below are the pieces that still exist. The
          # decisive freshness evidence is the build sha stamp, not any copy.
          grep -c "Stop underwriting like a" body.html && echo "HERO: CURRENT (coin-flip headline)" || echo "HERO: OLD OR MISSING"
          grep -c "The OM lands Thursday" body.html && echo "SUPERSEDED HERO STILL PRESENT" || true
          grep -o "page rendered[^<]*" body.html || echo "no render stamp found"
          grep -o "data last verified[^<]*" body.html && echo "STEWARD MARKER: present" || echo "STEWARD MARKER: absent (no steward run yet — expected until the nightly cron lands)"
          grep -c "stage-rail" body.html && echo "SIX-STAGE RAIL (Sep 8, #240): present" || echo "SIX-STAGE RAIL (Sep 8, #240): not yet deployed"
          grep -c "feature-grid" body.html && echo "FEATURE ICON GRID (Sep 8, #240): present" || echo "FEATURE ICON GRID (Sep 8, #240): not yet deployed"
          grep -c "screenrun-line" body.html && echo "SCREEN-RUN TRACE: present" || echo "SCREEN-RUN TRACE: missing"
          grep -c "Break it yourself" body.html && echo "STRESS BENCH: present" || echo "STRESS BENCH: missing"
          grep -c "irr-gauge" body.html && echo "IRR GAUGE: present" || echo "IRR GAUGE: missing"
          grep -c "stamp-in" body.html && echo "VERDICT STAMP: present" || echo "VERDICT STAMP: missing"
          grep -c "scroll-progress" body.html && echo "SCROLL PROGRESS: present" || echo "SCROLL PROGRESS: missing"
          grep -c "Aerial view of" body.html && echo "MARKETS GALLERY (aerials): present" || echo "MARKETS GALLERY: missing"
          grep -c "The ground layer" body.html && echo "GROUND LAYER TEXT: STILL PRESENT (pre-#240 build)" || echo "GROUND LAYER TEXT: gone (correct after #240)"
          grep -c "pulse-tile" body.html && echo "MARKET PULSE BOARD: STILL PRESENT (pre-#240 build)" || echo "MARKET PULSE BOARD: gone (correct after #240)"
          grep -o 'name="uc-build" content="[0-9a-f]*"' body.html | head -1 && echo "SELF-HEAL SENTINEL: armed (stale browser copies reload themselves)" || echo "SELF-HEAL SENTINEL: not yet deployed"
          live=$(grep -o 'commit/[0-9a-f]\{7\}' body.html | head -1 | cut -d/ -f2)
          echo "LIVE BUILD SHA: ${live:-not stamped yet} · this run's main tip: ${GITHUB_SHA:0:7}"
          echo "== FIRST 1200 CHARS OF BODY =="
          head -c 1200 body.html
      - name: Alternate-host check (diagnostic, non-gating)
        # The blueprint names the service underwrite-copilot-web, but the
        # canonical URL is underwrite-copilot.onrender.com — if BOTH resolve,
        # two services exist and a user bookmarking the other one sees a
        # frozen site while every probe here passes. Report what each serves.
        run: |
          for host in underwrite-copilot.onrender.com underwrite-copilot-web.onrender.com; do
            echo "== $host =="
            code=$(curl -sS -o alt.html -w "%{http_code}" --max-time 30 -H "Cache-Control: no-cache" "https://$host/?probe=${GITHUB_RUN_ID}" || echo "FETCH-FAILED")
            echo "HTTP $code · $(wc -c < alt.html 2>/dev/null || echo 0) bytes"
            grep -q 'name="uc-build"' alt.html && echo "  serves a build with the self-heal sentinel: $(grep -o 'name="uc-build" content="[0-9a-f]*"' alt.html | head -1)" || echo "  does NOT serve the current build"
            grep -o "latest improvement:[^<]*" alt.html | head -1 || true
            rm -f alt.html
          done
      - name: Public pages spot-check
        run: |
          for path in demo why whats-new market; do
            curl -sS -o "p_$path.html" --max-time 60 "https://underwrite-copilot.onrender.com/$path" || true
          done
          grep -q "Behind this screen" p_demo.html && echo "/demo: research layer present" || echo "/demo: MISSING research section"
          grep -q "Eviction Diversion Program" p_demo.html && echo "/demo: legal panel present (real rule text serves)" || echo "/demo: legal panel not yet deployed"
          grep -q "would you ask the broker" p_demo.html && echo "/demo: broker-question cards present" || echo "/demo: broker-question cards not yet deployed"
          grep -q "ranks run tightest first" p_demo.html && echo "DEMO PACK POSITION (Aug 25): present" || echo "DEMO PACK POSITION (Aug 25): not yet deployed"
          # The sample screen and the homepage render the same DEEP_TOOLS
          # constant, so this marker failing while the homepage one passes
          # means the two surfaces have drifted.
          grep -q "Four more tools pick up where it stops" p_demo.html && echo "DEMO DEEP TOOLS BLOCK (Aug 28): present" || echo "DEMO DEEP TOOLS BLOCK: not yet deployed"
          # The sample's summary bar carries its deal kind, inferred from its
          # own extraction; the chip's tooltip is the grep.
          grep -q "kind is read first" p_demo.html && echo "DEMO DEAL TYPE CHIP (Sep 8): present" || echo "DEMO DEAL TYPE CHIP (Sep 8): not yet deployed"
          grep -q "copy citation" p_market.html && echo "/market: copy-citation + FMR ladder present" || echo "/market: citation tools not yet deployed"
          grep -q "By asset type" p_market.html && echo "/market: sector snapshot panel present (Aug 25)" || echo "/market: sector panel not yet deployed"
          # Coverage heat grid: every market x every asset class, with the
          # within-column shading rule stated in the header.
          grep -q "so office compares to office" p_market.html && echo "COVERAGE HEAT GRID (Aug 25): present" || echo "COVERAGE HEAT GRID (Aug 25): not yet deployed"
          grep -q "Asset-type read" p_market.html && echo "/market: compare sector table present (Aug 25)" || echo "/market: compare sector table not yet deployed"
          grep -q "grid grid-cols-1 items-center gap-12" body.html && echo "MOBILE HERO GRID FIX (Aug 25): present" || echo "MOBILE HERO GRID FIX (Aug 25): not yet deployed"
          # The gallery tiles carry the sector-led metro facts (the marquee
          # left the homepage in #240; the fact strings ride the aerials now).
          grep -qE "% vac[^<]*rules? on file" body.html && echo "GALLERY FACTS SPEAK ASSET CLASSES: present" || echo "GALLERY FACTS SPEAK ASSET CLASSES: not present"
          # Scope consistency: "18 covered markets" contradicted the 15-market scope.
          grep -q "18 covered markets" body.html && echo "SCOPE CONTRADICTION: REGRESSED (18 covered markets is back)" || echo "SCOPE CONTRADICTION: absent (correct)"
          # Full-coverage spot check: Dallas's brief must carry its encoded
          # industrial note — proves the batch-2-5 metros serve, not just batch 1.
          curl -sS -o p_market_dfw.html --max-time 60 "https://underwrite-copilot.onrender.com/market?metro=dallas" || true
          grep -q "biggest industrial build" p_market_dfw.html && echo "/market?metro=dallas: full-coverage sector data serves (Aug 25)" || echo "/market?metro=dallas: batch 2-5 sector data not yet deployed"
          # DMV office fills: NoVA's brief must carry the Newmark/CBRE spread note.
          curl -sS -o p_market_nova.html --max-time 60 "https://underwrite-copilot.onrender.com/market?metro=nova" || true
          grep -q "tightening while the District" p_market_nova.html && echo "NOVA OFFICE SPREAD (Aug 25): present" || echo "NOVA OFFICE SPREAD (Aug 25): not yet deployed"
          # Each brief's sector rows carry a rank chip into the cross-metro
          # ranking (the chip's title text is count-independent).
          grep -q "tightest first" p_market_nova.html && echo "METRO RANK CHIPS (Aug 25): present" || echo "METRO RANK CHIPS (Aug 25): not yet deployed"
          # Sector leaderboard: the retail tab must rank the covered markets AND
          # name the metros whose numeric level is held open (never dropped).
          curl -sS -o p_market_retail.html --max-time 60 "https://underwrite-copilot.onrender.com/market?sector=retail" || true
          grep -q "ranked tightest to loosest" p_market_retail.html && echo "SECTOR LEADERBOARD (Aug 25): present" || echo "SECTOR LEADERBOARD (Aug 25): not yet deployed"
          grep -q "numeric level held open" p_market_retail.html && echo "SECTOR LEADERBOARD held-open line (Aug 25): present" || echo "SECTOR LEADERBOARD held-open line (Aug 25): not yet deployed"
          grep -q "It knows the ground" p_why.html && echo "/why: current copy present" || echo "/why: OLD copy"
          grep -q "takes your answer right on the deal" p_why.html && echo "/why: overnight copy present" || echo "/why: overnight copy MISSING"
          grep -q "ticker-track-reverse" p_why.html && echo "/why: markets band present" || echo "/why: markets band not yet deployed"
          grep -q "screenrun-line" p_why.html && echo "/why: screen-run trace present" || echo "/why: screen-run trace not yet deployed"
          grep -q "multifamily, and retail vacancy" p_why.html && echo "/why: asset-type copy includes retail (Aug 25)" || echo "/why: asset-type copy still pre-retail"
          grep -q "It knows what kind of deal it is" p_why.html && echo "/why: strategy section present (Sep 8)" || echo "/why: strategy section not yet deployed"
          grep -q "improvement" p_whats-new.html && echo "/whats-new: public changelog serves" || echo "/whats-new: not serving (pre-#98 build or auth-walled)"
          # The changelog-as-tour rebuild: day groups, momentum line, and
          # every entry linking to where it landed.
          grep -q "improvements logged since" p_whats-new.html && echo "WHATS-NEW TOUR (Aug 25): present" || echo "WHATS-NEW TOUR (Aug 25): not yet deployed"
          grep -q "See it live" p_whats-new.html && echo "WHATS-NEW entry links (Aug 25): present" || echo "WHATS-NEW entry links (Aug 25): not yet deployed"
          # The Sep 7 review round (#176-#180): the changelog titles are the
          # public trace of the deploy — imagery, strategy-first, News live
          # layer. Present = Render is serving a build that carries them.
          grep -q "strategy is read first" p_whats-new.html && echo "SEP 7 STRATEGY-FIRST (#178): present" || echo "SEP 7 STRATEGY-FIRST (#178): not yet deployed"
          grep -q "News is never empty" p_whats-new.html && echo "SEP 7 NEWS LIVE LAYER (#180): present" || echo "SEP 7 NEWS LIVE LAYER (#180): not yet deployed"
          # Sep 8: the plan-deal round (#193-#195) — the yield-on-cost grid's
          # changelog title is its public trace.
          grep -q "judged on yield on cost" p_whats-new.html && echo "SEP 8 YIELD ON COST (#194): present" || echo "SEP 8 YIELD ON COST (#194): not yet deployed"
          # Sep 8, later: the portfolio round (#208) — analytics, the meeting
          # export and the shared screen read the deal's kind. Its changelog
          # title is the public trace (no apostrophe in the grep: React
          # escapes one in the HTML).
          grep -q "knows the deal" p_whats-new.html && echo "SEP 8 PORTFOLIO KIND (#208): present" || echo "SEP 8 PORTFOLIO KIND (#208): not yet deployed"
          # /market must open for ANONYMOUS visitors (no cookies here): the
          # signed-out chrome says "Get started"; a login redirect would 200
          # on /login and fail the covered-market grep instead.
          grep -q "Get started" p_market.html && grep -qi "covered market" p_market.html \
            && echo "/market: opens signed-out with public chrome" \
            || echo "/market: NOT public yet (pre-#102 build serves a login wall)"
          # The public sample IC memo must serve real PDF bytes — the memo
          # renderer only fails at request time, so probe the artifact itself.
          curl -sS -o memo.pdf --max-time 60 "https://underwrite-copilot.onrender.com/api/demo/memo" || true
          [ "$(head -c 5 memo.pdf 2>/dev/null)" = "%PDF-" ] \
            && echo "/api/demo/memo: serves a real PDF ($(wc -c < memo.pdf) bytes)" \
            || echo "/api/demo/memo: NOT serving PDF bytes — memo render failing"
          curl -sS -o report.pdf --max-time 60 "https://underwrite-copilot.onrender.com/api/demo/report" || true
          [ "$(head -c 5 report.pdf 2>/dev/null)" = "%PDF-" ] \
            && echo "/api/demo/report: serves a real PDF ($(wc -c < report.pdf) bytes)" \
            || echo "/api/demo/report: not serving PDF bytes (pre-#126 build, or report render failing)"
      - name: Verdict
        # Two tiers: the hero headline proves the site is up and on the right
        # lineage; the build-sha stamp (the uc-build sentinel, printed above
        # beside this run's main tip) is what tells a fresh build from a stale
        # one — no copy marker can, since copy is exactly what changes.
        run: |
          if ! grep -q "Stop underwriting like a" body.html; then
            echo "VERDICT: LIVE SITE IS SERVING AN OLD BUILD — Render is not deploying main. Check dashboard.render.com → underwrite-copilot-web → Events for failed deploys (likely build OOM on the starter instance) or auto-deploy toggled off."
            exit 1
          fi
          if ! grep -q 'name="uc-build"' body.html; then
            echo "VERDICT: SITE UP but serving a build without the build stamp (pre-Aug-25) — Render likely stopped picking up pushes partway through. Check Render → Events."
            exit 1
          fi
          echo "VERDICT: LIVE SITE IS CURRENT — compare LIVE BUILD SHA to this run's main tip above; any 'unchanged' sighting is client-side cache, and a refresh after ~10 minutes clears it now that expireTime is capped."
      # The public pages are rendered from live data, so they only exist as
      # HTML once fetched — this is the one place their text can be read the
      # way a visitor's screen reader reads it. Every page fetched above plus
      # the legal and sign-in pages go through the same lint the render tests
      # run on the signed-in views (lib/render-lint.ts): a digit glued to a
      # word, a doubled word, an image with no alt, a nameless button or
      # link, an unlabelled control, a duplicate id. The homepage once served
      # "29machine-evaluable rules" for a month with every marker above
      # green. The allow-list is the changelog entry that quotes the typos
      # it fixed. Gating: a red run here is a page to fix, not a flaky probe.
      # (The checkout the script needs is the job's first step: a checkout
      # into a non-empty workspace clears it, HTML fetched so far included.)
      - name: Public pages read clean (text + accessibility lint)
        run: |
          for path in login privacy security terms; do
            curl -sS -o "p_$path.html" --max-time 60 "https://underwrite-copilot.onrender.com/$path" || true
          done
          node scripts/lint-pages.mjs --allow=aboutabout,9real,29machine body.html p_*.html
