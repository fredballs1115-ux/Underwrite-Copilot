name: live-verify
# Fetches the LIVE site from GitHub's network (the build container cannot
# reach it) and reports exactly what it serves — the decisive evidence for
# "did the deploy land". Run manually (Actions tab → live-verify → Run
# workflow) or automatically on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live homepage
        # Cache-busting query + no-cache request header: the verdict must
        # reflect the ORIGIN's current build, never a stale CDN/SWR copy.
        run: |
          set -x
          curl -sS -D headers.txt -o body.html --max-time 60 \
            -H "Cache-Control: no-cache" \
            "https://underwrite-copilot.onrender.com/?probe=${GITHUB_RUN_ID}" || true
          echo "== RESPONSE HEADERS =="; cat headers.txt || true
          echo "== BYTES =="; wc -c body.html || true
      - name: Check for current-build markers
        run: |
          echo "== MARKER CHECKS =="
          grep -c "Stop underwriting like a" body.html && echo "HERO: CURRENT (coin-flip headline restored per request)" || echo "HERO: OLD OR MISSING"
          grep -c "The OM lands Thursday" body.html && echo "SUPERSEDED HERO STILL PRESENT" || true
          grep -o "page rendered[^<]*" body.html || echo "no render stamp found"
          grep -c "ticker-track" body.html && echo "TICKER: present" || echo "TICKER: missing"
          grep -c "The ground layer" body.html && echo "GROUND LAYER (national expansion): present" || echo "GROUND LAYER: missing"
          grep -o "data last verified[^<]*" body.html && echo "STEWARD MARKER: present" || echo "STEWARD MARKER: absent (no steward run yet — expected until the nightly cron lands)"
          grep -c "Silver Spring fourplex" body.html && echo "OVERNIGHT PLAYGROUND (Aug 22): present" || echo "OVERNIGHT PLAYGROUND: MISSING — serving a pre-Aug-22-overnight build"
          grep -c "rolling age exemption" body.html && echo "OVERNIGHT COPY (Aug 22): present" || echo "OVERNIGHT COPY: MISSING"
          grep -c "ticker-track-reverse" body.html && echo "MARKETS MARQUEE (Aug 23): present" || echo "MARKETS MARQUEE: not yet deployed"
          grep -c "Built in the open" body.html && echo "SHIPPED BLOCK (Aug 23): present" || echo "SHIPPED BLOCK: not yet deployed"
          grep -c "hero-rotator-item" body.html && echo "HERO ROTATOR (Aug 23): present" || echo "HERO ROTATOR: not yet deployed"
          grep -c "Break it yourself" body.html && echo "STRESS BENCH (Aug 24): present" || echo "STRESS BENCH: not yet deployed"
          grep -c "Or hold its artifacts" body.html && echo "ARTIFACT LINKS (Aug 24): present" || echo "ARTIFACT LINKS: not yet deployed"
          grep -c "Legal screen:" body.html && echo "LEGAL BABY NOTE (Aug 24): present" || echo "LEGAL BABY NOTE: not yet deployed"
          grep -c "pulse-tile" body.html && echo "MARKET PULSE BOARD (Aug 24): present" || echo "MARKET PULSE BOARD: not yet deployed"
          grep -c "irr-gauge" body.html && echo "IRR GAUGE (Aug 24): present" || echo "IRR GAUGE: not yet deployed"
          grep -c "stamp-in" body.html && echo "VERDICT STAMP (Aug 24): present" || echo "VERDICT STAMP: not yet deployed"
          grep -c "rt-strike" body.html && echo "RETRADE REPLAY (Aug 25): present" || echo "RETRADE REPLAY: not yet deployed"
          grep -c "scroll-progress" body.html && echo "SCROLL PROGRESS (Aug 25): present" || echo "SCROLL PROGRESS: not yet deployed"
          grep -c "Primary documents on file" body.html && echo "PRIMARY SOURCES STRIP (Aug 25): present" || echo "PRIMARY SOURCES STRIP: not yet deployed"
          grep -o 'name="uc-build" content="[0-9a-f]*"' body.html | head -1 && echo "SELF-HEAL SENTINEL: armed (stale browser copies reload themselves)" || echo "SELF-HEAL SENTINEL: not yet deployed"
          live=$(grep -o 'commit/[0-9a-f]\{7\}' body.html | head -1 | cut -d/ -f2)
          echo "LIVE BUILD SHA: ${live:-not stamped yet} · this run's main tip: ${GITHUB_SHA:0:7}"
          echo "== FIRST 1200 CHARS OF BODY =="
          head -c 1200 body.html
      - name: Alternate-host check (diagnostic, non-gating)
        # The blueprint names the service underwrite-copilot-web, but the
        # canonical URL is underwrite-copilot.onrender.com — if BOTH resolve,
        # two services exist and a user bookmarking the other one sees a
        # frozen site while every probe here passes. Report what each serves.
        run: |
          for host in underwrite-copilot.onrender.com underwrite-copilot-web.onrender.com; do
            echo "== $host =="
            code=$(curl -sS -o alt.html -w "%{http_code}" --max-time 30 -H "Cache-Control: no-cache" "https://$host/?probe=${GITHUB_RUN_ID}" || echo "FETCH-FAILED")
            echo "HTTP $code · $(wc -c < alt.html 2>/dev/null || echo 0) bytes"
            grep -q "Silver Spring fourplex" alt.html && echo "  serves the CURRENT build" || echo "  does NOT serve the current build"
            grep -o "latest improvement:[^<]*" alt.html | head -1 || true
            rm -f alt.html
          done
      - name: Public pages spot-check
        run: |
          for path in demo why whats-new market; do
            curl -sS -o "p_$path.html" --max-time 60 "https://underwrite-copilot.onrender.com/$path" || true
          done
          grep -q "Behind this screen" p_demo.html && echo "/demo: research layer present" || echo "/demo: MISSING research section"
          grep -q "Eviction Diversion Program" p_demo.html && echo "/demo: legal panel present (real rule text serves)" || echo "/demo: legal panel not yet deployed"
          grep -q "would you ask the broker" p_demo.html && echo "/demo: broker-question cards present" || echo "/demo: broker-question cards not yet deployed"
          grep -q "copy citation" p_market.html && echo "/market: copy-citation + FMR ladder present" || echo "/market: citation tools not yet deployed"
          grep -q "By asset type" p_market.html && echo "/market: sector snapshot panel present (Aug 25)" || echo "/market: sector panel not yet deployed"
          grep -q "Asset-type read" p_market.html && echo "/market: compare sector table present (Aug 25)" || echo "/market: compare sector table not yet deployed"
          grep -q "The trackers disagree too" body.html && echo "SPREAD BOARD (Aug 25): present" || echo "SPREAD BOARD (Aug 25): not yet deployed"
          grep -q "DFW office vacancy" body.html && echo "TICKER SECTOR ITEMS (Aug 25): present" || echo "TICKER SECTOR ITEMS (Aug 25): not yet deployed"
          grep -q "pulse-face" body.html && echo "PULSE TILES ROTATE ASSET CLASSES (Aug 25): present" || echo "PULSE TILES ROTATE ASSET CLASSES (Aug 25): not yet deployed"
          # The marquee/hero fact strings lead with a sector read and end in the
          # rules count — a combination only the sector-led metroFact produces.
          grep -qE "% vac[^<]*rules? on file" body.html && echo "MARQUEE AND HERO SPEAK ASSET CLASSES (Aug 25): present" || echo "MARQUEE AND HERO SPEAK ASSET CLASSES (Aug 25): not yet deployed"
          # Full-coverage spot check: Dallas's brief must carry its encoded
          # industrial note — proves the batch-2-5 metros serve, not just batch 1.
          curl -sS -o p_market_dfw.html --max-time 60 "https://underwrite-copilot.onrender.com/market?metro=dallas" || true
          grep -q "biggest industrial build" p_market_dfw.html && echo "/market?metro=dallas: full-coverage sector data serves (Aug 25)" || echo "/market?metro=dallas: batch 2-5 sector data not yet deployed"
          # DMV office fills: NoVA's brief must carry the Newmark/CBRE spread note.
          curl -sS -o p_market_nova.html --max-time 60 "https://underwrite-copilot.onrender.com/market?metro=nova" || true
          grep -q "tightening while the District" p_market_nova.html && echo "NOVA OFFICE SPREAD (Aug 25): present" || echo "NOVA OFFICE SPREAD (Aug 25): not yet deployed"
          grep -q "It knows the ground" p_why.html && echo "/why: current copy present" || echo "/why: OLD copy"
          grep -q "takes your answer right on the deal" p_why.html && echo "/why: overnight copy present" || echo "/why: overnight copy MISSING"
          grep -q "ticker-track-reverse" p_why.html && echo "/why: markets band present" || echo "/why: markets band not yet deployed"
          grep -q "screenrun-line" p_why.html && echo "/why: screen-run trace present" || echo "/why: screen-run trace not yet deployed"
          grep -q "multifamily, and retail vacancy" p_why.html && echo "/why: asset-type copy includes retail (Aug 25)" || echo "/why: asset-type copy still pre-retail"
          grep -q "improvement" p_whats-new.html && echo "/whats-new: public changelog serves" || echo "/whats-new: not serving (pre-#98 build or auth-walled)"
          # /market must open for ANONYMOUS visitors (no cookies here): the
          # signed-out chrome says "Get started"; a login redirect would 200
          # on /login and fail the covered-market grep instead.
          grep -q "Get started" p_market.html && grep -qi "covered market" p_market.html \
            && echo "/market: opens signed-out with public chrome" \
            || echo "/market: NOT public yet (pre-#102 build serves a login wall)"
          # The public sample IC memo must serve real PDF bytes — the memo
          # renderer only fails at request time, so probe the artifact itself.
          curl -sS -o memo.pdf --max-time 60 "https://underwrite-copilot.onrender.com/api/demo/memo" || true
          [ "$(head -c 5 memo.pdf 2>/dev/null)" = "%PDF-" ] \
            && echo "/api/demo/memo: serves a real PDF ($(wc -c < memo.pdf) bytes)" \
            || echo "/api/demo/memo: NOT serving PDF bytes — memo render failing"
          curl -sS -o report.pdf --max-time 60 "https://underwrite-copilot.onrender.com/api/demo/report" || true
          [ "$(head -c 5 report.pdf 2>/dev/null)" = "%PDF-" ] \
            && echo "/api/demo/report: serves a real PDF ($(wc -c < report.pdf) bytes)" \
            || echo "/api/demo/report: not serving PDF bytes (pre-#126 build, or report render failing)"
      - name: Verdict
        # Three tiers: the standing markers prove the site is up and on the
        # right lineage; the OVERNIGHT marker proves the build is from the
        # Aug-22 overnight run or later — the standing markers alone cannot
        # tell a fresh build from a stale one.
        run: |
          if ! grep -q "Stop underwriting like a" body.html || ! grep -q "The ground layer" body.html; then
            echo "VERDICT: LIVE SITE IS SERVING AN OLD BUILD — Render is not deploying main. Check dashboard.render.com → underwrite-copilot-web → Events for failed deploys (likely build OOM on the starter instance) or auto-deploy toggled off."
            exit 1
          fi
          if ! grep -q "Silver Spring fourplex" body.html; then
            echo "VERDICT: SITE UP but serving a build OLDER than the Aug-22 overnight run — Render likely stopped picking up pushes partway through. Check Render → Events."
            exit 1
          fi
          echo "VERDICT: LIVE SITE IS CURRENT (origin serves the overnight build) — any 'unchanged' sighting is client-side cache; a refresh after ~10 minutes clears it now that expireTime is capped."
