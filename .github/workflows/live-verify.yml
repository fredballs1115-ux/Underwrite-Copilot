name: live-verify
# Fetches the LIVE site from GitHub's network (the build container cannot
# reach it) and reports exactly what it serves — the decisive evidence for
# "did the deploy land". Run manually (Actions tab → live-verify → Run
# workflow) or automatically on every push to main.
on:
  workflow_dispatch:
    inputs:
      skyline_markets:
        description: >-
          Skyline sweep: space-separated metro ids (e.g. "dc baltimore
          richmond"). Blank sweeps every market.
        required: false
        default: ""
      skyline_search:
        description: >-
          Skyline sweep: hunt for NEW candidates instead of verifying the
          photographs already chosen.
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # First, before any fetch: the page lint at the end runs from the repo
      # (scripts/lint-pages.mjs + lib/render-lint.ts), and a checkout into a
      # workspace that already holds files clears them.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch live homepage
        # Cache-busting query + no-cache request header: the verdict must
        # reflect the ORIGIN's current build, never a stale CDN/SWR copy.
        run: |
          set -x
          curl -sS -D headers.txt -o body.html --max-time 60 \
            -H "Cache-Control: no-cache" \
            "https://underwrite-copilot.onrender.com/?probe=${GITHUB_RUN_ID}" || true
          echo "== RESPONSE HEADERS =="; cat headers.txt || true
          echo "== BYTES =="; wc -c body.html || true
      - name: Check for current-build markers
        run: |
          echo "== MARKER CHECKS =="
          # The Sep 8 simplification (#240) cut the homepage to one idea per
          # section — the markers below are the pieces that still exist. The
          # decisive freshness evidence is the build sha stamp, not any copy.
          grep -c "Stop underwriting like a" body.html && echo "HERO: CURRENT (coin-flip headline)" || echo "HERO: OLD OR MISSING"
          grep -c "The OM lands Thursday" body.html && echo "SUPERSEDED HERO STILL PRESENT" || true
          grep -o "page rendered[^<]*" body.html || echo "no render stamp found"
          grep -o "data last verified[^<]*" body.html && echo "STEWARD MARKER: present" || echo "STEWARD MARKER: absent (no steward run yet — expected until the nightly cron lands)"
          grep -c "stage-rail" body.html && echo "SIX-STAGE RAIL (Sep 8, #240): present" || echo "SIX-STAGE RAIL (Sep 8, #240): not yet deployed"
          grep -c "feature-grid" body.html && echo "FEATURE ICON GRID (Sep 8, #240): present" || echo "FEATURE ICON GRID (Sep 8, #240): not yet deployed"
          grep -c "trust-strip" body.html && echo "TRUST STRIP under pricing (Sep 14, #273): present" || echo "TRUST STRIP under pricing (Sep 14, #273): not yet deployed"
          grep -c "screenrun-line" body.html && echo "SCREEN-RUN TRACE: present" || echo "SCREEN-RUN TRACE: missing"
          grep -c "Break it yourself" body.html && echo "STRESS BENCH: present" || echo "STRESS BENCH: missing"
          grep -c "irr-gauge" body.html && echo "IRR GAUGE: present" || echo "IRR GAUGE: missing"
          grep -c "stamp-in" body.html && echo "VERDICT STAMP: present" || echo "VERDICT STAMP: missing"
          grep -c "scroll-progress" body.html && echo "SCROLL PROGRESS: present" || echo "SCROLL PROGRESS: missing"
          grep -c "Aerial view of" body.html && echo "MARKETS GALLERY (aerials): present" || echo "MARKETS GALLERY: missing"
          grep -c "The ground layer" body.html && echo "GROUND LAYER TEXT: STILL PRESENT (pre-#240 build)" || echo "GROUND LAYER TEXT: gone (correct after #240)"
          grep -c "pulse-tile" body.html && echo "MARKET PULSE BOARD: STILL PRESENT (pre-#240 build)" || echo "MARKET PULSE BOARD: gone (correct after #240)"
          grep -o 'name="uc-build" content="[0-9a-f]*"' body.html | head -1 && echo "SELF-HEAL SENTINEL: armed (stale browser copies reload themselves)" || echo "SELF-HEAL SENTINEL: not yet deployed"
          live=$(grep -o 'commit/[0-9a-f]\{7\}' body.html | head -1 | cut -d/ -f2)
          echo "LIVE BUILD SHA: ${live:-not stamped yet} · this run's main tip: ${GITHUB_SHA:0:7}"
          # The one comparison that matters, spelled out so nobody eyeballs two
          # shas: a push-triggered run lands minutes before the deploy does
          # (LAGGING is expected there); a dispatched run more than ~10 minutes
          # after the merge still LAGGING means Render did not deploy main —
          # check dashboard.render.com → underwrite-copilot-web → Events.
          if [ "${live:-}" = "${GITHUB_SHA:0:7}" ]; then
            echo "DEPLOY: LIVE — the live build is this run's main tip"
          else
            echo "DEPLOY: LAGGING — live build ${live:-none} is not main tip ${GITHUB_SHA:0:7} (expected right after a merge; after ~10 minutes it means Render did not deploy)"
          fi
          echo "== FIRST 1200 CHARS OF BODY =="
          head -c 1200 body.html
      - name: Alternate-host check (diagnostic, non-gating)
        # The blueprint names the service underwrite-copilot-web, but the
        # canonical URL is underwrite-copilot.onrender.com — if BOTH resolve,
        # two services exist and a user bookmarking the other one sees a
        # frozen site while every probe here passes. Report what each serves.
        run: |
          for host in underwrite-copilot.onrender.com underwrite-copilot-web.onrender.com; do
            echo "== $host =="
            code=$(curl -sS -o alt.html -w "%{http_code}" --max-time 30 -H "Cache-Control: no-cache" "https://$host/?probe=${GITHUB_RUN_ID}" || echo "FETCH-FAILED")
            echo "HTTP $code · $(wc -c < alt.html 2>/dev/null || echo 0) bytes"
            grep -q 'name="uc-build"' alt.html && echo "  serves a build with the self-heal sentinel: $(grep -o 'name="uc-build" content="[0-9a-f]*"' alt.html | head -1)" || echo "  does NOT serve the current build"
            grep -o "latest improvement:[^<]*" alt.html | head -1 || true
            rm -f alt.html
          done
      - name: Public pages spot-check
        run: |
          for path in demo why whats-new market; do
            curl -sS -o "p_$path.html" --max-time 60 "https://underwrite-copilot.onrender.com/$path" || true
          done
          grep -q "Behind this screen" p_demo.html && echo "/demo: research layer present" || echo "/demo: MISSING research section"
          grep -q "Eviction Diversion Program" p_demo.html && echo "/demo: legal panel present (real rule text serves)" || echo "/demo: legal panel not yet deployed"
          grep -q "would you ask the broker" p_demo.html && echo "/demo: broker-question cards present" || echo "/demo: broker-question cards not yet deployed"
          grep -q "ranks run tightest first" p_demo.html && echo "DEMO PACK POSITION (Aug 25): present" || echo "DEMO PACK POSITION (Aug 25): not yet deployed"
          # The sample screen and the homepage render the same DEEP_TOOLS
          # constant, so this marker failing while the homepage one passes
          # means the two surfaces have drifted.
          grep -q "Four more tools pick up where it stops" p_demo.html && echo "DEMO DEEP TOOLS BLOCK (Aug 28): present" || echo "DEMO DEEP TOOLS BLOCK: not yet deployed"
          # The sample's summary bar carries its deal kind, inferred from its
          # own extraction; the chip's tooltip is the grep.
          grep -q "kind is read first" p_demo.html && echo "DEMO DEAL TYPE CHIP (Sep 8): present" || echo "DEMO DEAL TYPE CHIP (Sep 8): not yet deployed"
          grep -q "copy citation" p_market.html && echo "/market: copy-citation + FMR ladder present" || echo "/market: citation tools not yet deployed"
          grep -q "By asset type" p_market.html && echo "/market: sector snapshot panel present (Aug 25)" || echo "/market: sector panel not yet deployed"
          # Coverage heat grid: every market x every asset class, with the
          # within-column shading rule stated in the header.
          grep -q "so office compares to office" p_market.html && echo "COVERAGE HEAT GRID (Aug 25): present" || echo "COVERAGE HEAT GRID (Aug 25): not yet deployed"
          grep -q "Asset-type read" p_market.html && echo "/market: compare sector table present (Aug 25)" || echo "/market: compare sector table not yet deployed"
          grep -q "grid grid-cols-1 items-center gap-12" body.html && echo "MOBILE HERO GRID FIX (Aug 25): present" || echo "MOBILE HERO GRID FIX (Aug 25): not yet deployed"
          # The gallery tiles carry the sector-led metro facts (the marquee
          # left the homepage in #240; the fact strings ride the aerials now).
          grep -qE "% vac[^<]*rules? on file" body.html && echo "GALLERY FACTS SPEAK ASSET CLASSES: present" || echo "GALLERY FACTS SPEAK ASSET CLASSES: not present"
          # Scope consistency: "18 covered markets" contradicted the 15-market scope.
          grep -q "18 covered markets" body.html && echo "SCOPE CONTRADICTION: REGRESSED (18 covered markets is back)" || echo "SCOPE CONTRADICTION: absent (correct)"
          # Full-coverage spot check: Dallas's brief must carry its encoded
          # industrial note — proves the batch-2-5 metros serve, not just batch 1.
          curl -sS -o p_market_dfw.html --max-time 60 "https://underwrite-copilot.onrender.com/market?metro=dallas" || true
          grep -q "biggest industrial build" p_market_dfw.html && echo "/market?metro=dallas: full-coverage sector data serves (Aug 25)" || echo "/market?metro=dallas: batch 2-5 sector data not yet deployed"
          # DMV office fills: NoVA's brief must carry the Newmark/CBRE spread note.
          curl -sS -o p_market_nova.html --max-time 60 "https://underwrite-copilot.onrender.com/market?metro=nova" || true
          # A metro area read without a brief (#404): its own page body.
          curl -sS -o p_market_pitt.html --max-time 60 "https://underwrite-copilot.onrender.com/market?metro=pittsburgh" || true
          # What a search engine is handed (#430): the sitemap and the
          # IndexNow key the site serves at its root.
          curl -sS -o sitemap.xml --max-time 60 "https://underwrite-copilot.onrender.com/sitemap.xml" || true
          curl -sS -o indexnow-key.txt --max-time 60 "https://underwrite-copilot.onrender.com/a399847bdac5364f2ed07a0d161f42ab.txt" || true
          echo "SITEMAP: $(grep -o '<loc>' sitemap.xml | wc -l) URLs, $(grep -o 'market?metro=' sitemap.xml | wc -l) of them market pages"
          grep -q "tightening while the District" p_market_nova.html && echo "NOVA OFFICE SPREAD (Aug 25): present" || echo "NOVA OFFICE SPREAD (Aug 25): not yet deployed"
          # Each brief's sector rows carry a rank chip into the cross-metro
          # ranking (the chip's title text is count-independent).
          grep -q "tightest first" p_market_nova.html && echo "METRO RANK CHIPS (Aug 25): present" || echo "METRO RANK CHIPS (Aug 25): not yet deployed"
          # Sector leaderboard: the retail tab must rank the covered markets AND
          # name the metros whose numeric level is held open (never dropped).
          curl -sS -o p_market_retail.html --max-time 60 "https://underwrite-copilot.onrender.com/market?sector=retail" || true
          grep -q "ranked tightest to loosest" p_market_retail.html && echo "SECTOR LEADERBOARD (Aug 25): present" || echo "SECTOR LEADERBOARD (Aug 25): not yet deployed"
          grep -q "numeric level held open" p_market_retail.html && echo "SECTOR LEADERBOARD held-open line (Aug 25): present" || echo "SECTOR LEADERBOARD held-open line (Aug 25): not yet deployed"
          grep -q "It knows the ground" p_why.html && echo "/why: current copy present" || echo "/why: OLD copy"
          grep -q "takes your answer right on the deal" p_why.html && echo "/why: overnight copy present" || echo "/why: overnight copy MISSING"
          grep -q "ticker-track-reverse" p_why.html && echo "/why: markets band present" || echo "/why: markets band not yet deployed"
          grep -q "screenrun-line" p_why.html && echo "/why: screen-run trace present" || echo "/why: screen-run trace not yet deployed"
          grep -q "multifamily, and retail vacancy" p_why.html && echo "/why: asset-type copy includes retail (Aug 25)" || echo "/why: asset-type copy still pre-retail"
          grep -q "It knows what kind of deal it is" p_why.html && echo "/why: strategy section present (Sep 8)" || echo "/why: strategy section not yet deployed"
          grep -q "improvement" p_whats-new.html && echo "/whats-new: public changelog serves" || echo "/whats-new: not serving (pre-#98 build or auth-walled)"
          # The changelog-as-tour rebuild: day groups, momentum line, and
          # every entry linking to where it landed.
          grep -q "improvements logged since" p_whats-new.html && echo "WHATS-NEW TOUR (Aug 25): present" || echo "WHATS-NEW TOUR (Aug 25): not yet deployed"
          grep -q "See it live" p_whats-new.html && echo "WHATS-NEW entry links (Aug 25): present" || echo "WHATS-NEW entry links (Aug 25): not yet deployed"
          # The Sep 7 and Sep 8 rounds (#178, #180, #194, #208) grepped their
          # changelog titles here; those entries have since been trimmed from
          # the log, so the lines printed "not yet deployed" on every run of
          # a site that was fine. lib/live-verify-markers.test.ts now renders
          # /whats-new and holds every grep of it to the page as served.
          # /market must open for ANONYMOUS visitors (no cookies here): the
          # signed-out chrome says "Get started"; a login redirect would 200
          # on /login and fail the covered-market grep instead.
          grep -q "Get started" p_market.html && grep -qi "covered market" p_market.html \
            && echo "/market: opens signed-out with public chrome" \
            || echo "/market: NOT public yet (pre-#102 build serves a login wall)"
          # The public sample IC memo must serve real PDF bytes — the memo
          # renderer only fails at request time, so probe the artifact itself.
          curl -sS -o memo.pdf --max-time 60 "https://underwrite-copilot.onrender.com/api/demo/memo" || true
          [ "$(head -c 5 memo.pdf 2>/dev/null)" = "%PDF-" ] \
            && echo "/api/demo/memo: serves a real PDF ($(wc -c < memo.pdf) bytes)" \
            || echo "/api/demo/memo: NOT serving PDF bytes — memo render failing"
          curl -sS -o report.pdf --max-time 60 "https://underwrite-copilot.onrender.com/api/demo/report" || true
          [ "$(head -c 5 report.pdf 2>/dev/null)" = "%PDF-" ] \
            && echo "/api/demo/report: serves a real PDF ($(wc -c < report.pdf) bytes)" \
            || echo "/api/demo/report: not serving PDF bytes (pre-#126 build, or report render failing)"
      - name: News feeds from the deployment's own network (diagnostic, non-gating)
        # The News page's live layer fetches the publishers' feeds from
        # Render, not from a browser — so only Render can say which ones
        # answer. The health route names each source's outcome; an empty
        # section is diagnosed here, not guessed at. Bounded: every source
        # resolves inside its deadline, so this answers within ~10 s.
        run: |
          code=$(curl -sS -o news.json -w "%{http_code}" --max-time 45 "https://underwrite-copilot.onrender.com/api/news/health" || echo "FETCH-FAILED")
          echo "NEWS HEALTH: HTTP $code"
          node -e '
            const fs = require("fs");
            let j; try { j = JSON.parse(fs.readFileSync("news.json", "utf8")); } catch { console.log("NEWS HEALTH: no JSON (pre-#269 build, or the route failed)"); process.exit(0); }
            console.log("NEWS HEALTH: " + j.summary);
            for (const s of j.sources ?? []) console.log(`  ${s.ok ? "ok  " : "FAIL"} ${String(s.ms).padStart(5)} ms  ${String(s.count).padStart(3)} items  ${s.stale ? "stale " : ""}${s.cached ? "cached " : ""}${s.name}${s.via ? " via " + s.via : ""}${s.error ? " — " + s.error : ""}`);
            for (const h of (j.top ?? []).slice(0, 3)) console.log(`  top: ${h.title} — ${h.publisher}`);
            // Which process answered and how long it has been up (#285):
            // a warm-up of null on a process minutes old is a defect.
            if (j.process) console.log(`NEWS PROCESS: pid ${j.process.pid}, up ${j.process.uptimeS}s`);
            // The boot warm-up (#278) reads the sources one at a time before
            // any visitor; the route reports its last run (#280) and, since
            // #283, its progress while it is still running.
            if (j.warm && j.warm.done === false) console.log(`NEWS WARM-UP: running — ${j.warm.answered} of ${j.warm.total} sources answered so far, ${(j.warm.ms / 1000).toFixed(1)}s in, started ${j.warm.started}`);
            else if (j.warm) console.log(`NEWS WARM-UP: ${j.warm.answered} of ${j.warm.total} sources answered at boot, ${(j.warm.ms / 1000).toFixed(1)}s, at ${j.warm.at}`);
            else console.log("NEWS WARM-UP: not reported (pre-#280 build, NEWS_WARM=0, or a pre-#283 process still warming)");
            // A host that timed out or answered 5xx three times in a minute
            // is held at bay (#283); its doors are skipped so the second
            // search host gets the whole budget. Named here while held.
            if (Array.isArray(j.held) && j.held.length) console.log("NEWS HELD: " + j.held.map((h) => `${h.host} until ${h.until} after ${h.failures} failures`).join(" · "));
            else if (Array.isArray(j.held)) console.log("NEWS HELD: none");
          ' || true
      - name: The search doors, from the runner (diagnostic, non-gating)
        # Every Google News read has a Bing News read behind it (#278). The
        # sandbox that writes this code cannot reach either host, so the
        # runner checks each door's shape: HTTP status, item count, the
        # outlet element the parser reads, the click redirect it unwraps.
        run: |
          probe() {
            local label="$1" url="$2" code items src click
            code=$(curl -sS -o door.xml -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (compatible; UnderwriteCopilot/1.0; +https://underwrite-copilot.onrender.com/news)" "$url" || echo "FETCH-FAILED")
            items=$(grep -o "<item>" door.xml 2>/dev/null | wc -l | tr -d ' ')
            src=$(grep -o -i "<news:source>" door.xml 2>/dev/null | wc -l | tr -d ' ')
            click=$(grep -o "apiclick.aspx" door.xml 2>/dev/null | wc -l | tr -d ' ')
            echo "SEARCH DOOR ${label}: HTTP ${code} · ${items} items · ${src} News:Source · ${click} click redirects"
            rm -f door.xml
          }
          probe "Bing · site:therealdeal.com" "https://www.bing.com/news/search?q=site%3Atherealdeal.com&format=rss"
          probe "Bing · commercial real estate" "https://www.bing.com/news/search?q=%22commercial+real+estate%22&format=rss"
          # The three topic queries behind the other Google searches (#283
          # dropped the OR / quote syntax that parsed to zero items), each
          # with a second phrasing beside it: the run on 18:12 UTC read 12
          # items for the debt query but 2 for "multifamily apartments
          # sale" and 1 for "rent control ordinance", so the code uses the
          # one word and the one quoted phrase, and the probes keep a
          # candidate each in case those thin out.
          probe "Bing · multifamily" "https://www.bing.com/news/search?q=multifamily&format=rss"
          probe "Bing · multifamily (alt: apartment complex)" "https://www.bing.com/news/search?q=%22apartment+complex%22&format=rss"
          probe "Bing · CRE debt" "https://www.bing.com/news/search?q=CMBS+delinquency+distress&format=rss"
          probe "Bing · rent regulation" "https://www.bing.com/news/search?q=%22rent+control%22&format=rss"
          probe "Bing · rent regulation (alt: rent stabilization)" "https://www.bing.com/news/search?q=%22rent+stabilization%22&format=rss"
          # Commercial Property Executive's site-scoped Bing read parsed to
          # zero items on Render (18:36 UTC): the outlet publishes under
          # commercialsearch.com. Three phrasings, so the next fix can pick
          # the one Bing answers.
          probe "Bing · site:commercialsearch.com" "https://www.bing.com/news/search?q=site%3Acommercialsearch.com&format=rss"
          probe "Bing · site:commercialsearch.com/news" "https://www.bing.com/news/search?q=site%3Acommercialsearch.com%2Fnews&format=rss"
          probe "Bing · Commercial Property Executive (phrase)" "https://www.bing.com/news/search?q=%22Commercial+Property+Executive%22&format=rss"
          # Doors CPE might still have (19:25 UTC: Google held at bay on a
          # fresh process left it the one source with no answer, since
          # every Bing phrasing above parses to zero): its own feed at
          # the site root and at the outlet's old domain, Google's phrase
          # search, and Bing on the bare domain. Read the counts here
          # before wiring any of them.
          probe "CPE · own feed at the root" "https://www.commercialsearch.com/feed/"
          probe "CPE · old domain feed" "https://www.cpexecutive.com/feed/"
          probe "Google · Commercial Property Executive (phrase)" "https://news.google.com/rss/search?q=%22Commercial+Property+Executive%22&hl=en-US&gl=US&ceid=US%3Aen"
          probe "Bing · commercialsearch.com (bare)" "https://www.bing.com/news/search?q=commercialsearch.com&format=rss"
          probe "Google · site:therealdeal.com" "https://news.google.com/rss/search?q=site%3Atherealdeal.com&hl=en-US&gl=US&ceid=US%3Aen"
      - name: The skyline photographs, resolved from the runner (diagnostic, non-gating)
        # Every market photograph is a Wikimedia Commons file addressed by
        # name. The sandbox that writes those names cannot reach Commons —
        # its egress proxy answers 403 to the CONNECT — so a filename typed
        # there is a claim, and an author or licence typed there would be a
        # guess. A guessed attribution is a licence breach with somebody's
        # name on it, so nothing is published on a guess: this step resolves
        # each candidate here, where the network is open, and prints the real
        # author, licence and pixel size to paste into lib/skyline.ts.
        # --search asks Commons what exists; with no flag it verifies the
        # candidates already chosen. While the table is being filled the
        # search is what earns its keep, so that is the mode wired here.
        # Verify by default, now that lib/skyline.ts names a photograph for
        # every market that has one: each deploy re-resolves those files from
        # Commons and prints LIVE or DEAD, so a file deleted upstream shows
        # up here rather than as a market that quietly lost its picture.
        # Tick skyline_search to hunt for new candidates instead.
        #
        # Both inputs come in through the environment rather than being
        # interpolated into the script line: a ${{ }} expression spliced into
        # a shell command is the standard Actions injection hole, and word
        # splitting an env var is exactly the behaviour wanted here anyway.
        env:
          SKYLINE_MARKETS: ${{ inputs.skyline_markets }}
          SKYLINE_SEARCH: ${{ inputs.skyline_search == true && '--search' || '' }}
        run: node scripts/probe-skylines.mjs --terse $SKYLINE_SEARCH $SKYLINE_MARKETS || true

      - name: The photographs as a VISITOR gets them (diagnostic, non-gating)
        # The step above asks Commons from this runner. That is a different
        # network path from the one a reader uses, and it answers a different
        # question. This one asks the SITE, which is the question that matters:
        # does /api/imagery/skyline/<id> hand back an image?
        #
        # WHY THIS EXISTS. #316 gave NoVA a Rosslyn photograph and its round
        # marker read `present`, because the marker grepped the photographer's
        # name out of the served HTML — and the credit line renders whether or
        # not the picture resolves (the fallback to the overhead is in the
        # component, client-side, by design). So the marker could not fail.
        # Meanwhile the Commons probe was printing `DEAD undefined` for that
        # market, because the candidate entries had been committed as bare
        # strings and the probe reads `cand.file`. A marker that cannot fail
        # beside a probe that was not looking: the picture's actual state was
        # unobserved in both directions.
        #
        # The route 404s on every failure — no file in the table, Commons
        # gone, wrong content-type — so a 200 with an image type is the whole
        # claim, and it cannot be satisfied by anything but a real photograph.
        run: |
          # ONE probe behind both loops. It prints the market's line and
          # returns 0 for a real photograph, so the two callers only count.
          #
          # Two things it gets right that the first version did not.
          #
          # A TRANSPORT failure is retried once. Run 35162762657 reported
          # `DEAD norfolk_hampton_roads` on `curl: (35) Recv failure:
          # Connection reset by peer`, eight seconds after the same file
          # resolved LIVE from Commons and one run after it served LIVE from
          # the site. That is a dropped connection between the runner and
          # Render, not a broken picture — and a check that cries wolf on a
          # flake is a check people stop reading, which costs more than the
          # flake. Only code 000 (curl's own failure) is retried: a 404 or a
          # 500 is the route's real answer, and asking twice would hide it.
          #
          # And the fallback REPLACES curl's output rather than appending to
          # it. curl writes its `-w` line even when it fails, so the old
          # `|| echo "000 0 -"` landed on the same line and printed
          # `HTTP 000 · 000 0 -`. Assigning in the `||` branch discards the
          # partial line.
          #
          # The two NUMERIC fields come first and the content type LAST,
          # because a type is the one field that can carry a space
          # ("image/jpeg; charset=…"). Typed last, that space lands in the
          # field this reads as the type and nowhere else; typed in the
          # middle it would shift the byte count into `$((size/1024))`,
          # which is an arithmetic error, and under `bash -e` an error there
          # takes the whole step down.
          probe_img() {
            local id="$1" url="$2" out code size type attempt
            for attempt in 1 2; do
              out=$(curl -sS -o /tmp/img.bin -w '%{http_code} %{size_download} %{content_type}' \
                --max-time 60 "$url") || out="000 0 -"
              code=$(printf '%s' "$out" | cut -d' ' -f1)
              size=$(printf '%s' "$out" | cut -d' ' -f2)
              type=$(printf '%s' "$out" | cut -d' ' -f3-)
              if [ "$code" = "000" ] && [ "$attempt" = "1" ]; then
                printf '  retry %-24s the connection dropped, asking once more\n' "$id"
                sleep 3
                continue
              fi
              break
            done
            case "$code $type" in
              "200 image/"*)
                printf '  LIVE  %-24s %s · %s KB\n' "$id" "$type" "$((size/1024))"
                return 0 ;;
              *)
                printf '  DEAD  %-24s HTTP %s · %s\n' "$id" "$code" "${type:--}"
                return 1 ;;
            esac
          }

          echo "PHOTOGRAPHS, through the site's own route:"
          live=0; dead=0
          # The ids come from the table the site actually serves, read out of
          # the source rather than listed here, so a market added to
          # lib/skyline.ts is probed the next run without touching this file.
          ids=$(node -e 'const s=require("fs").readFileSync("lib/skyline.ts","utf8");for(const m of s.matchAll(/^  ([a-z_]+): \{$/gm))console.log(m[1])')
          for id in $ids; do
            # Ask at the width a page actually renders, so the byte counts
            # here are comparable to the Commons probe's above.
            if probe_img "$id" "https://underwrite-copilot.onrender.com/api/imagery/skyline/$id?w=1600"; then
              live=$((live+1))
            else
              dead=$((dead+1))
            fi
          done
          echo "PHOTOGRAPHS: $live live, $dead dead — a DEAD market is showing an aerial, not a skyline"

          # The markets that keep an overhead ON PURPOSE — a suburban
          # submarket has no skyline, so Montgomery County is deliberately
          # out of lib/skyline.ts (PG County was too, until National
          # Harbor's wheel turned out to be its picture). That left them probed by
          # nothing at all: the loop above only walks the skyline table, so
          # the two markets whose ONLY picture is the aerial were the least
          # observed on the site. If that route breaks they have no fallback
          # left, which makes them the ones most worth watching, not least.
          echo "AERIALS, for the markets that keep an overhead on purpose:"
          alive=0; gone=0
          skyids=$(echo "$ids" | tr '\n' ' ')
          allids=$(node -e 'const s=require("fs").readFileSync("lib/metro-imagery.ts","utf8");for(const m of s.matchAll(/^  ([a-z_]+): \{/gm))console.log(m[1])')
          for id in $allids; do
            case " $skyids " in *" $id "*) continue ;; esac
            if probe_img "$id" "https://underwrite-copilot.onrender.com/api/imagery/metro/$id?w=1600&h=900"; then
              alive=$((alive+1))
            else
              gone=$((gone+1))
            fi
          done
          echo "AERIALS: $alive live, $gone dead — these markets have no skyline to fall back to"

      - name: Verdict
        # Two tiers: the hero headline proves the site is up and on the right
        # lineage; the build-sha stamp (the uc-build sentinel, printed above
        # beside this run's main tip) is what tells a fresh build from a stale
        # one — no copy marker can, since copy is exactly what changes.
        run: |
          if ! grep -q "Stop underwriting like a" body.html; then
            echo "VERDICT: LIVE SITE IS SERVING AN OLD BUILD — Render is not deploying main. Check dashboard.render.com → underwrite-copilot-web → Events for failed deploys (likely build OOM on the starter instance) or auto-deploy toggled off."
            exit 1
          fi
          if ! grep -q 'name="uc-build"' body.html; then
            echo "VERDICT: SITE UP but serving a build without the build stamp (pre-Aug-25) — Render likely stopped picking up pushes partway through. Check Render → Events."
            exit 1
          fi
          echo "VERDICT: LIVE SITE IS CURRENT — compare LIVE BUILD SHA to this run's main tip above; any 'unchanged' sighting is client-side cache, and a refresh after ~10 minutes clears it now that expireTime is capped."
      # The public pages are rendered from live data, so they only exist as
      # HTML once fetched — this is the one place their text can be read the
      # way a visitor's screen reader reads it. Every page fetched above plus
      # the legal and sign-in pages go through the same lint the render tests
      # run on the signed-in views (lib/render-lint.ts): a digit glued to a
      # word, a doubled word, an image with no alt, a nameless button or
      # link, an unlabelled control, a duplicate id. The homepage once served
      # "29machine-evaluable rules" for a month with every marker above
      # green. The allow-list is the changelog entry that quotes the typos
      # it fixed. Gating: a red run here is a page to fix, not a flaky probe.
      # (The checkout the script needs is the job's first step: a checkout
      # into a non-empty workspace clears it, HTML fetched so far included.)
      - name: Public pages read clean (text + accessibility lint)
        run: |
          for path in login privacy security terms; do
            curl -sS -o "p_$path.html" --max-time 60 "https://underwrite-copilot.onrender.com/$path" || true
          done
          node scripts/lint-pages.mjs --allow=aboutabout,9real,29machine body.html p_*.html
      # LAST ON PURPOSE. The build-marker gate near the top reads the hero
      # headline and the build stamp, and both survive most rounds
      # unchanged — so it passes on a stale build and says nothing about
      # whether THIS round deployed. These do, one per surface a round
      # touched, each chosen because the previous build cannot produce it.
      #
      # They print at the very end because that is where a reader looks
      # first, and because a job log is read from its tail.
      - name: Did this round actually deploy? (the round's own markers)
        run: |
          curl -sS -o p_tools2.html --max-time 60 "https://underwrite-copilot.onrender.com/tools" || true
          # `if` rather than `cmd; check $?`: these steps run under `bash -e`,
          # where a bare failing grep would abort the step and take every
          # marker after it down with it. An `if` condition is exempt.
          # …and it TALLIES, because this log is long and a truncated read
          # shows only its tail. The markers against `body.html` sit near
          # the top of the list and had become unreadable: the tail is all
          # the /tools ones, and the full log downloads from a blob host
          # that a sandboxed reader cannot reach. So the last line printed
          # is a roll-up — how many passed, and the NAME of every one that
          # did not — which makes a round's proof legible however much of
          # the middle is out of reach.
          MARKS_OK=0
          MARKS_BAD=0
          MARKS_FAILED=""
          mark() {
            if "${@:2}"; then
              echo "  present      $1"
              MARKS_OK=$((MARKS_OK + 1))
            else
              echo "  NOT DEPLOYED $1"
              MARKS_BAD=$((MARKS_BAD + 1))
              MARKS_FAILED="${MARKS_FAILED}~${1}"
            fi
          }
          both() { grep -q "on-photo" p_why.html && grep -q "band-words" p_why.html; }
          copies() { [ "$(grep -o "Copy as table" p_tools2.html | wc -l)" -ge 2 ]; }
          bidtwice() { [ "$(grep -o "What you can pay" p_tools2.html | wc -l)" -ge 2 ]; }
          echo "ROUND MARKERS — what the live site is actually serving:"
          mark "#302 photo treatment (on-photo + band-words on /why)" both
          mark "#302 deal math reads the shorthand (seeded \$20M on /tools)" grep -q 'value="\$20M"' p_tools2.html
          mark "#302 gallery credit names the licence" grep -q "via Wikimedia Commons, CC BY" body.html
          mark "#304 the cash-flow strip is on /tools" grep -q "Paste a cash flow" p_tools2.html
          mark "#305 the work leaves the page (Copy link)" grep -q "Copy link to this sizing" p_tools2.html
          mark "#306 net effective rent, both ways" grep -q "The face rent is" p_tools2.html
          mark "#307 the loan schedule draws its split" grep -q "equity, returned at sale" p_tools2.html
          mark "#307 the refinance test reads the balloon" grep -q "Can the balloon be refinanced" p_tools2.html
          mark "#308 the LP/GP waterfall is on /tools" grep -q "Who actually gets the return" p_tools2.html
          mark "#309 the unit mix reader is on /tools" grep -q "Read the unit mix" p_tools2.html
          mark "#310 sources and uses is on /tools" grep -q "Sources and uses" p_tools2.html
          mark "#310 /tools indexes itself" grep -q "Jump to" p_tools2.html
          mark "#312 acres into square feet, on the page" grep -q "One acre is 43,560 square feet" p_tools2.html
          mark "#312 the load factor converts the quoted rent" grep -q "per foot you can furnish" p_tools2.html
          mark "#313 the land residual is on /tools" grep -q "What the land can be worth" p_tools2.html
          mark "#313 the residual says its own sensitivity" grep -q "a residual is a range and not a number" p_tools2.html
          mark "#314 the homepage names what /tools serves" grep -q "more calculations, with no deal behind them" body.html
          # #340 — the shelf is clustered, not one flat row of thirty
          # chips. Grepping a cluster HEADING proves the grouping
          # rendered; "Equity &amp; returns" is the escaped form,
          # because React writes an ampersand that way.
          mark "#340 the homepage shelf is clustered like the page it advertises" grep -q "Equity &amp; returns" body.html
          mark "#314 the homepage links a card by its anchor" grep -q 'href="/tools#residual-land"' body.html
          mark "#315 the after-tax card is on /tools" grep -q "Depreciation, and what the sale takes back" p_tools2.html
          mark "#315 it names the error it prevents" grep -q "Running the whole gain at the capital gains rate" p_tools2.html
          # NOT a test that the picture renders — the credit line is in the
          # server's HTML whether or not the file resolves, which is what
          # made this marker a false positive for a whole round. Whether NoVA
          # actually shows Rosslyn is answered by the PHOTOGRAPHS step above.
          mark "#316 NoVA's brief carries the Rosslyn credit" grep -q "Theodore Christopher" p_market_nova.html
          mark "#317 the settlement statement is on /tools" grep -q "Who owes whom at closing" p_tools2.html
          mark "#317 it names the direction, not just the figure" grep -q "misses by the sum of the two figures" p_tools2.html
          mark "#319 the 1031 exchange is on /tools" grep -q "Roll it into the next deal" p_tools2.html
