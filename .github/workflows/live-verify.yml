          mark "#319 the clock loses days to the return's due date" grep -q "fourth-quarter exchange files one first" p_tools2.html
          mark "#320 the expense reconciliation is on /tools" grep -q "What the tenant actually owes" p_tools2.html
          # The claim the card exists for: the one-sided gross-up, priced.
          mark "#320 it prices the one-sided gross-up" grep -q "leave the base year alone" p_tools2.html
          # The print layer is CSS, so the marker greps the class the page
