name: link-audit
# Runs the source-link audit from GitHub's network and commits the refreshed
# data/research/link_audit.json back to main, so verified-dead provenance
# links render as plain text on the next deploy. Add SUPABASE_URL +
# SUPABASE_SERVICE_ROLE_KEY as repo Actions secrets to include DB rows.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"   # Mondays — links rot slowly
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
      - run: node scripts/audit-source-links.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit refreshed audit
        run: |
          git config user.name "link-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/link_audit.json
          git diff --cached --quiet || git commit -m "link audit: refresh data/research/link_audit.json"
          git push
