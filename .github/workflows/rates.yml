name: rates
# Weekday FRED pull → the `rates` table, so every market figure on the site
# — the Treasury curve, SOFR, the credit spreads, the mortgage survey,
# inflation, the supply pipeline — is today's rather than one somebody
# typed. The series list is data/fred-series.json.
#
# This is the FREE way to run it. render.yaml also defines a
# `underwrite-copilot-rates` cron service that runs the identical script; you
# want ONE of the two, not both. On Render it's a paid always-on service; here
# it costs nothing. Pick this one unless you specifically want the job on
# Render's network.
#
# Dispatch it with `dry_run` ticked to fetch and print without writing: the
# log names each series by FRED's own title, which is how a new id is
# verified before it is trusted (the sandbox cannot reach FRED at all).
#
# No-ops with instructions until the Actions secrets exist, so a fresh fork
# never fails a run it was never configured for.
on:
  schedule:
    - cron: "43 12 * * 1-5" # weekdays, after the FRED morning release; off :00/:30, which GitHub load-sheds
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and print every series, write nothing (verifies the ids against FRED's own titles)"
        type: boolean
        default: false
      probe_ids:
        description: "Candidate FRED ids not in the table yet, space-separated: printed with FRED's own title and newest observation, written nowhere (implies dry_run)"
        required: false
        default: ""
      probe_search:
        description: "FRED full-text searches, separated by |: the top matches with their ids, written nowhere (implies dry_run)"
        required: false
        default: ""
      probe_bls:
        description: "Candidate BLS series ids, space-separated: fetched from api.bls.gov and printed with the newest observation (and the title, if BLS_API_KEY is set), written nowhere (implies dry_run)"
        required: false
        default: ""
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
      - name: Pull rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional: the BLS's free registration key lifts its API allowance
          # and adds the catalog (each series' own title) to a dry run.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          DRY_RUN: ${{ (inputs.dry_run == true || inputs.probe_ids != '' || inputs.probe_search != '' || inputs.probe_bls != '') && '1' || '' }}
          PROBE_IDS: ${{ inputs.probe_ids }}
          PROBE_SEARCH: ${{ inputs.probe_search }}
          PROBE_BLS: ${{ inputs.probe_bls }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY not set. Get a free key at https://fred.stlouisfed.org/docs/api/api_key.html and add it as an Actions secret. Skipping."
            exit 0
          fi
          if [ "$DRY_RUN" != "1" ] && { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "Supabase Actions secrets not set (repo Settings → Secrets → Actions: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY). Skipping."
            exit 0
          fi
          node scripts/fetch-rates.mjs
