name: cbsa-counties
# The Census Bureau's metro-area delineation → data/cbsa-counties.json
# (#447): every county of every metropolitan statistical area and the metro
# area it belongs to, so a deal in a suburb reads its metro's figures rather
# than its state's (scripts/fetch-cbsa-counties.mjs says why and what the
# runner printed of the file).
#
# The table goes to its own branch, `cbsa-counties`, force-pushed each run
# and never merged: the sandbox cannot reach census.gov, but it can fetch a
# branch of this repository, so the table is read from there and committed
# with the code that reads it. Dispatch only — the delineation changes when
# OMB redraws the areas, every few years.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  counties:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Read the delineation
        run: node scripts/fetch-cbsa-counties.mjs
      - name: Publish the table to its own branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp data/cbsa-counties.json out/
          cd out
          git init -q -b cbsa-counties
          git config user.name "cbsa-counties"
          git config user.email "cbsa-counties@users.noreply.github.com"
          git add -A
          git commit -q -m "cbsa-counties $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cbsa-counties
          echo "Pushed cbsa-counties.json to the cbsa-counties branch."
