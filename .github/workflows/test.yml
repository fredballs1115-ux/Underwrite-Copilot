name: test
# Typecheck, lint, unit tests, a production build, and the public pages'
# lint as that build serves them, on every push and PR.
#
# libreoffice-calc is a REAL dependency of this suite, not a convenience: the
# Excel export test loads the generated workbook into LibreOffice headless,
# recalculates it, and asserts the IRR cell matches the app's own number. The
# `libreoffice-core` package alone cannot open a spreadsheet, so `calc` has to
# be installed explicitly or that test skips and the export ships unverified.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install LibreOffice Calc (for the workbook recalculation test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          # The test SKIPS when soffice is missing, so a broken install would
          # look identical to a passing run. Assert it here instead: this fails
          # the job, loudly, rather than letting the export ship unverified.
          test -x /usr/bin/soffice
          soffice --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The build must not need real credentials — a missing key is only an
          # error at call time (lib/anthropic/client.ts), never at build time.
          NEXT_TELEMETRY_DISABLED: "1"
      # The public pages as served, through the lint live-verify runs after a
      # deploy (scripts/lint-pages.mjs: a digit glued to a word, an image with
      # no alt, a nameless button or link, an unlabelled control, an id used
      # twice). The render tests draw components; this reads the whole page,
      # which is where 32 glued words on /market's tables had gone unseen
      # until a local run caught them (2026-10-04). The proxy needs a Supabase
      # URL and key to start: a closed local port makes every read fail fast,
      # and each page renders its no-data state.
      - name: Lint the public pages as served
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:9"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-page-lint-placeholder"
        run: |
          npx next start -p 3311 > next-start.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3311/login)" = "200" ]; then break; fi
            sleep 1
          done
          mkdir -p served
          for p in "" why demo market "market?metro=dc" "market?metro=pittsburgh" "market?sector=office" "market?sector=retail" "market?sector=industrial" "market?sector=multifamily" whats-new login tools security privacy terms; do
            f="served/page_$(echo "${p:-home}" | tr '?=&/' '____').html"
            code=$(curl -s -m 90 "http://127.0.0.1:3311/$p" -o "$f" -w '%{http_code}')
            echo "$code /$p"
            if [ "$code" != "200" ]; then
              echo "::error::/$p answered $code"
              tail -60 next-start.log
              kill "$pid"
              exit 1
            fi
          done
          status=0
          node scripts/lint-pages.mjs --allow=aboutabout,9real,29machine served/page_*.html || status=$?
          kill "$pid"
          exit "$status"
