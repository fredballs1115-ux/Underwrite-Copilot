# Render Blueprint — defines the cloud service(s) for Underwrite Copilot.
#
# To use it: push this repo to GitHub, then in Render choose
# "New → Blueprint" and point it at the repo. Render reads this file and
# creates the service below. You fill in the secret values in the dashboard
# (they're marked `sync: false`, so they are never read from the repo).
#
# Why Render: it runs the app as a normal always-on server, so the long OM
# analysis can run as a background job without the function timeouts a
# serverless host would hit.

services:
  # ── The web app (Next.js) ─────────────────────────────────────────────────
  - type: web
    name: underwrite-copilot-web
    runtime: node
    plan: starter # always-on. Use "free" for cheap testing (it sleeps when idle).
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Dependency-free liveness route (no Supabase/middleware in its path) so
    # a deploy can't be marked failed by a third-party blip during the check.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard; never committed
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Stripe billing — set in the dashboard (see .env.example for how to get each).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Street View building photos (optional): metadata-checked, key stays
      # server-side behind /api/deals/[id]/photo. No key = clean no-photo cards.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Hand analyses to the dedicated worker below. ONLY set this to "1"
      # after (a) migration 0016 has been run and (b) the worker service is
      # live — with the flag on and no worker, screens would queue forever.
      # Unset/empty = analyses run in-process exactly as before.
      # - key: ANALYSIS_WORKER
      #   value: "1"

  # ── The dedicated analysis worker (Phase 2 — built) ────────────────────────
  # Runs the OM screens so web deploys never interrupt them: the web app
  # enqueues, this service claims + runs + checkpoints each step, and a deploy
  # just re-queues the in-flight job for the replacement instance to RESUME.
  # Same repo, same commit as the web app. Full setup: worker/README.md.
  - type: worker
    name: underwrite-copilot-worker
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:worker
    startCommand: npm run start:worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Emails link back to the app — keep identical to the web service.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Optional: analysis-ready + weekly digest emails BOTH send from the
      # worker (same values as the web service).
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: RESEND_FROM
      #   sync: false

  # ── Daily market intel (research build) ────────────────────────────────────
  # Weekday news sweep for the jurisdictions + sectors on file: Google News
  # RSS → dedupe → Claude scores relevance → digest + red-banner alerts for
  # likely rule changes. Requires migrations 0023 + 0024.
  - type: cron
    name: underwrite-copilot-intel
    runtime: node
    plan: starter
    branch: main
    schedule: "0 12 * * 1-5"
    buildCommand: npm install --omit=dev
    startCommand: node scripts/daily-intel.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false # same value as NEXT_PUBLIC_SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ── Daily rates pull (research build) ──────────────────────────────────────
  # FRED → rates table so screens use today's 10Y/SOFR/PMMS, not hardcoded
  # numbers. Free key: https://fred.stlouisfed.org/docs/api/api_key.html
  - type: cron
    name: underwrite-copilot-rates
    runtime: node
    plan: starter
    branch: main
    schedule: "30 12 * * 1-5"
    buildCommand: npm install --omit=dev
    startCommand: node scripts/fetch-rates.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRED_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ── Monthly HUD FMR pull (public-data registry build) ──────────────────────
  # huduser FMR API → benchmarks table, PRIMARY source for every covered
  # metro's fair market rents (closes the FY2026 verification gap). Monthly
  # because FMRs change annually (Oct 1) with occasional mid-year revisions.
  # Free token: https://www.huduser.gov/hudapi/public/register
  - type: cron
    name: underwrite-copilot-fmr
    runtime: node
    plan: starter
    branch: main
    schedule: "45 12 3 * *"
    buildCommand: npm install --omit=dev
    startCommand: node scripts/fetch-fmr.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HUD_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ── Nightly verification steward (national expansion) ─────────────────────
  # Link health + freshness + consistency checks + re-verification of the
  # oldest 'sourced' claims via web search. Writes data_issues/data_changelog/
  # steward_runs (migration 0028); the site footer's "data last verified"
  # marker reads the latest run, so a dead cron becomes visible within 48h.
  - type: cron
    name: underwrite-copilot-steward
    runtime: node
    plan: starter
    branch: main
    schedule: "0 6 * * *"
    buildCommand: npm install --omit=dev
    startCommand: node scripts/steward.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
